// ── Helpers ───────────────────────────────────────────────────────────────────
const TYPE_TO_TAB = { "URL/Texto":"url","WiFi":"wifi","Contacto":"vcard","SMS":"sms","WhatsApp":"sms" };
const TABS = [
  {id:"url",label:"Simple",icon:"🔗"},
  {id:"wifi",label:"WiFi",icon:"📶"},
  {id:"vcard",label:"Contacto",icon:"👤"},
  {id:"sms",label:"Mensaje",icon:"💬"},
  {id:"scan",label:"Escáner",icon:"📷"},
];

function buildWifi(ssid,pass,sec,hidden){ return `WIFI:T:${sec};S:${ssid};P:${pass};H:${hidden?"true":"false"};;`; }
function buildVCard(f){ return `BEGIN:VCARD\nVERSION:3.0\nFN:${f.name}\nTEL:${f.phone}\nEMAIL:${f.email}\nURL:${f.web}\nORG:${f.company}\nTITLE:${f.role}\nEND:VCARD`; }
function buildSMS(phone,msg,isWa){ return isWa?`https://wa.me/${phone.replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`:`sms:${phone}?body=${encodeURIComponent(msg)}`; }

function Field({label,children}){ return <div className="field"><label>{label}</label>{children}</div>; }

// ── Formularios ───────────────────────────────────────────────────────────────
function FormSimple({onQR}){
  const [val,setVal]=useState("");
  useEffect(()=>{ onQR(val||"","URL/Texto"); },[val]);
  return <Field label="URL o Texto"><input placeholder="https://ejemplo.com" value={val} onChange={e=>setVal(e.target.value)}/></Field>;
}

// ── Escáner ───────────────────────────────────────────────────────────────────
function Scanner({show}){
  const [result,setResult]=useState("");
  const [active,setActive]=useState(false);
  const scannerRef=useRef(null);
  const html5Ref=useRef(null);

  const start=async()=>{
    setActive(true);
    setResult("");
    await new Promise(r=>setTimeout(r,100));
    try{
      html5Ref.current=new Html5Qrcode("qr-scanner-region");
      await html5Ref.current.start(
        {facingMode:"environment"},
        {fps:10,qrbox:{width:250,height:250}},
        (text)=>{ setResult(text); stop(); },
        ()=>{}
      );
    }catch(e){ setResult("No se pudo acceder a la cámara"); setActive(false); }
  };

  const stop=async()=>{
    try{ if(html5Ref.current) await html5Ref.current.stop(); }catch(e){}
    setActive(false);
  };

  useEffect(()=>{ return ()=>{ try{ if(html5Ref.current) html5Ref.current.stop(); }catch(e){} }; },[]);

  if(!show) return null;
  return <div className="scanner-wrap">
    <div className="card-title">Escáner de QR</div>
    {!active && !result && <button className="btn btn-primary" style={{width:"100%",marginBottom:12}} onClick={start}>📷 Activar Cámara</button>}
    {active && <button className="btn btn-ghost" style={{width:"100%",marginBottom:12}} onClick={stop}>⏹ Detener</button>}
    <div id="qr-scanner-region" className="scanner-inner"></div>
    {result && <div className="scanner-result">
      ✓ {result}
      <br/>
      <button className="btn btn-secondary" style={{marginTop:8,width:"100%"}} onClick={()=>{ navigator.clipboard.writeText(result); }}>📋 Copiar resultado</button>
    </div>}
  </div>;
}

// ── App Principal ─────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("url");
  const [qrText,setQrText]=useState("");
  const [qrType,setQrType]=useState("URL/Texto");
  const [qrDataURL,setQrDataURL]=useState(null);
  const [size,setSize]=useState(280);
  const [fg,setFg]=useState("#000000");
  const [bg,setBg]=useState("#ffffff");
  const [nodeStyle,setNodeStyle]=useState("square");
  const [toasts,setToasts]=useState([]);
  const [installPrompt,setInstallPrompt]=useState(null);
  const ignorNextQR=useRef(false);

  const [history,setHistory]=useState(()=>{
    try{ return JSON.parse(localStorage.getItem("qr_history_v3"))||[]; }catch{ return []; }
  });

  // PWA install prompt
  useEffect(()=>{
    window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); setInstallPrompt(e); });
  },[]);

  const handleInstall=()=>{
    if(!installPrompt) return;
    installPrompt.prompt();
    installPrompt.userChoice.then(()=>setInstallPrompt(null));
  };

  const showToast=(msg,icon="✓")=>{
    const id=Date.now();
    setToasts(t=>[...t,{id,msg,icon}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2500);
  };

  // Generar QR con estilo de nodos via canvas
  const generateStyledQR=useCallback(async(text,px)=>{
    if(!text) return null;
    try{
      const dataURL=await QRCode.toDataURL(text,{width:px,margin:2,color:{dark:fg,light:bg},errorCorrectionLevel:"M"});
      if(nodeStyle==="square") return dataURL;

      // Renderizar con canvas para nodos redondeados o pixel
      const canvas=document.createElement("canvas");
      canvas.width=px; canvas.height=px;
      const ctx=canvas.getContext("2d");
      const img=new Image();
      img.src=dataURL;
      await new Promise(r=>{img.onload=r;});

      ctx.fillStyle=bg;
      ctx.fillRect(0,0,px,px);

      // Detectar módulos del QR y redibujarlos con el estilo elegido
      const tempCanvas=document.createElement("canvas");
      tempCanvas.width=px; tempCanvas.height=px;
      const tempCtx=tempCanvas.getContext("2d");
      tempCtx.drawImage(img,0,0,px,px);
      const imageData=tempCtx.getImageData(0,0,px,px);

      const moduleSize=px/37;
      ctx.fillStyle=fg;

      for(let y=0;y<37;y++){
        for(let x=0;x<37;x++){
          const px2=Math.floor(x*moduleSize+moduleSize/2);
          const py2=Math.floor(y*moduleSize+moduleSize/2);
          const idx=(py2*px+px2)*4;
          const isDark=imageData.data[idx]<128;
          if(!isDark) continue;

          const rx=x*moduleSize+2;
          const ry=y*moduleSize+2;
          const ms=moduleSize-4;

          if(nodeStyle==="rounded"){
            const r=ms*0.35;
            ctx.beginPath();
            ctx.moveTo(rx+r,ry);
            ctx.arcTo(rx+ms,ry,rx+ms,ry+ms,r);
            ctx.arcTo(rx+ms,ry+ms,rx,ry+ms,r);
            ctx.arcTo(rx,ry+ms,rx,ry,r);
            ctx.arcTo(rx,ry,rx+ms,ry,r);
            ctx.closePath();
            ctx.fill();
          } else if(nodeStyle==="circle"){
            ctx.beginPath();
            ctx.arc(rx+ms/2,ry+ms/2,ms/2,0,Math.PI*2);
            ctx.fill();
          } else if(nodeStyle==="pixel"){
            const half=ms/2;
            ctx.fillRect(rx,ry,half-1,half-1);
            ctx.fillRect(rx+half+1,ry,half-1,half-1);
            ctx.fillRect(rx,ry+half+1,half-1,half-1);
            ctx.fillRect(rx+half+1,ry+half+1,half-1,half-1);
          }
        }
      }
      return canvas.toDataURL("image/png");
    }catch{ return null; }
  },[fg,bg,nodeStyle]);

  useEffect(()=>{
    if(!qrText){ setQrDataURL(null); return; }
    generateStyledQR(qrText,size).then(setQrDataURL);
  },[qrText,size,fg,bg,nodeStyle]);

  const handleQR=useCallback((text,type)=>{
    if(ignorNextQR.current){ ignorNextQR.current=false; return; }
    setQrText(text); setQrType(type);
  },[]);

  const handleTabChange=useCallback((id)=>{
    ignorNextQR.current=true;
    setTab(id); setQrText(""); setQrDataURL(null);
  },[]);

  const saveToHistory=(dataURL)=>{
    const next=[{id:Date.now(),type:qrType,val:qrText.slice(0,40),fullText:qrText,dataURL},...history].slice(0,10);
    setHistory(next);
    localStorage.setItem("qr_history_v3",JSON.stringify(next));
  };

  const handleDownload=async()=>{
    if(!qrText) return;
    const big=await generateStyledQR(qrText,600);
    if(!big) return;
    const a=document.createElement("a");
    a.href=big; a.download=`zyncx_qr_${Date.now()}.png`; a.click();
    saveToHistory(qrDataURL);
    showToast("PNG descargado ✓","⬇️");
  };

  const handleDownloadSVG=async()=>{
    if(!qrText) return;
    try{
      const svgString=await QRCode.toString(qrText,{type:"svg",color:{dark:fg,light:bg},errorCorrectionLevel:"M"});
      const blob=new Blob([svgString],{type:"image/svg+xml"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download=`zyncx_qr_${Date.now()}.svg`; a.click();
      URL.revokeObjectURL(url);
      showToast("SVG descargado ✓","🎨");
    }catch{ showToast("Error al generar SVG","⚠️"); }
  };

  const handleCopy=async()=>{
    if(!qrText) return;
    try{
      const dataURL=await generateStyledQR(qrText,512);
      const img=new Image(); img.src=dataURL;
      await new Promise(r=>{img.onload=r;});
      const canvas=document.createElement("canvas");
      canvas.width=512; canvas.height=512;
      const ctx=canvas.getContext("2d");
      ctx.fillStyle=bg; ctx.fillRect(0,0,512,512);
      ctx.drawImage(img,0,0,512,512);
      canvas.toBlob(async(blob)=>{
        try{
          await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
          showToast("¡Copiado!","📋");
        }catch{ showToast("Tu navegador no permite copiar imágenes","⚠️"); }
      },"image/png");
    }catch{ showToast("Error al copiar","⚠️"); }
  };

  const handleHistoryClick=useCallback((item)=>{
    const original=item.fullText||item.val;
    const targetTab=TYPE_TO_TAB[item.type]||"url";
    ignorNextQR.current=true;
    setTab(targetTab); setQrType(item.type);
    generateStyledQR(original,size).then(url=>{
      setQrDataURL(url); setQrText(original);
    });
    showToast(`QR ${item.type} cargado`,"🔄");
  },[size,fg,bg,nodeStyle]);

  const removeHistory=(id,e)=>{ e.stopPropagation(); const next=history.filter(x=>x.id!==id); setHistory(next); localStorage.setItem("qr_history_v3",JSON.stringify(next)); };
  const clearHistory=()=>{ setHistory([]); localStorage.removeItem("qr_history_v3"); };

  const NODE_STYLES=[
    {id:"square",label:"■ Cuadrado"},
    {id:"rounded",label:"▣ Redondeado"},
    {id:"circle",label:"● Círculo"},
    {id:"pixel",label:"⊞ Pixel Art"},
  ];

  return <>
    <style>{css}</style>
    <div className="app">
      {/* Header */}
      <div className="header">
        <div className="header-logo">QR</div>
        <div>
          <div className="header-title">Zyncx QR Generator</div>
          <div className="header-sub">// Sin límites. Sin anuncios. Sin registro.</div>
        </div>
        <button className={`install-btn ${installPrompt?"visible":""}`} onClick={handleInstall}>📲 Instalar App</button>
        <div className="badge">100% Gratis</div>
      </div>

      {/* Tabs */}
      <div className="tabs">
        {TABS.map(t=>(
          <button key={t.id} className={`tab ${tab===t.id?"active":""}`} onClick={()=>handleTabChange(t.id)}>
            {t.icon} {t.label}
          </button>
        ))}
      </div>

      <div className="main-grid">
        {/* Formulario */}
        <div>
          {tab!=="scan" && <div className="card">
            <div className="card-title">Datos del QR</div>
            {tab==="url" && <FormSimple onQR={handleQR}/>}
            {tab==="wifi" && <FormWifi onQR={handleQR}/>}
            {tab==="vcard" && <FormVCard onQR={handleQR}/>}
            {tab==="sms" && <FormSMS onQR={handleQR}/>}

            <hr className="divider"/>

            {/* Personalización */}
            <div className="section-label">Personalizar</div>
            <div className="field">
              <label>Tamaño del QR</label>
              <div className="slider-wrap">
                <input type="range" min={150} max={500} value={size} onChange={e=>setSize(Number(e.target.value))}/>
                <span className="slider-val">{size}px</span>
              </div>
            </div>
            <div className="color-row">
              <div className="color-field">
                <label>Color QR</label>
                <div className="color-input-wrap">
                  <input type="color" value={fg} onChange={e=>setFg(e.target.value)}/>
                  <span>{fg}</span>
                </div>
              </div>
              <div className="color-field">
                <label>Fondo</label>
                <div className="color-input-wrap">
                  <input type="color" value={bg} onChange={e=>setBg(e.target.value)}/>
                  <span>{bg}</span>
                </div>
              </div>
            </div>
            <div className="field" style={{marginTop:12}}>
              <label>Estilo de nodos</label>
              <div className="node-grid">
                {NODE_STYLES.map(n=>(
                  <div key={n.id} className={`node-opt ${nodeStyle===n.id?"active":""}`} onClick={()=>setNodeStyle(n.id)}>{n.label}</div>
                ))}
              </div>
            </div>

            {/* Botones */}
            <div className="btn-group">
              <button className="btn btn-primary" onClick={handleDownload} disabled={!qrDataURL}>⬇️ PNG</button>
              <button className="btn btn-secondary" onClick={handleDownloadSVG} disabled={!qrText}>🎨 SVG</button>
              <button className="btn btn-secondary" onClick={handleCopy} disabled={!qrDataURL}>📋 Copiar</button>
              <button className="btn btn-ghost" onClick={()=>{setQrText("");setQrDataURL(null);}}>✕</button>
            </div>
          </div>}

          {/* Escáner */}
          {tab==="scan" && <div className="card"><Scanner show={true}/></div>}

          {/* Historial */}
          {history.length>0 && <div className="card" style={{marginTop:20}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div className="card-title" style={{marginBottom:0}}>Historial</div>
              <button className="btn btn-ghost" style={{flex:"none",minWidth:0,padding:"6px 12px",fontSize:12}} onClick={clearHistory}>Limpiar</button>
            </div>
            <div className="history-list">
              {history.map(item=>(
                <div key={item.id} className="history-item" onClick={()=>handleHistoryClick(item)}>
                  <div className="history-thumb">{item.dataURL&&<img src={item.dataURL} alt="qr"/>}</div>
                  <div className="history-info">
                    <div className="history-type">{item.type}</div>
                    <div className="history-val">{item.val}</div>
                  </div>
                  <button className="history-del" onClick={(e)=>removeHistory(item.id,e)}>×</button>
                </div>
              ))}
            </div>
          </div>}
        </div>

        {/* Preview */}
        {tab!=="scan" && <div className="card qr-card">
          <div className="card-title">Vista previa</div>
          <div className="qr-info">
            <span className="qr-type">{qrType}</span>
            <span style={{fontSize:11,color:G.muted,fontFamily:"'Space Mono',monospace"}}>{size}px</span>
          </div>
          <div className="qr-preview" style={{background:bg}}>
            {qrDataURL
              ? <img src={qrDataURL} alt="QR" style={{width:Math.min(size,260),height:Math.min(size,260)}}/>
              : <div className="qr-placeholder"><span style={{fontSize:48,opacity:.3}}>▦</span><span>Ingresa datos para<br/>generar tu QR</span></div>
            }
          </div>
          {qrDataURL && <div style={{fontSize:11,color:G.muted,fontFamily:"'Space Mono',monospace",textAlign:"center"}}>✓ QR listo para usar</div>}
        </div>}
      </div>

      <div className="footer">Zyncx QR Generator © 2026 — Hecho con 🖤 para el mundo</div>
    </div>

    {/* Toasts */}
    <div className="toast-container">
      {toasts.map(t=><div key={t.id} className="toast">{t.icon} {t.msg}</div>)}
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
